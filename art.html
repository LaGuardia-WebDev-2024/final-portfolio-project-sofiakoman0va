      .parent-flex {

        border-radius: 10px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
      }
      
      .parent-flex img:hover {

      }

      #illustration-spotlight {

     <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
     $(document).ready(function () {
    $(".small-drawing").click(function () {
      const newSrc = $(this).attr("src");
      const newTitle = $(this).attr("data-title");
      const newInfo = $(this).attr("data-info");
      const newStatement = $(this).attr("data-statement");

      $("#illustration-spotlight").fadeOut(400, function () {
        $(this).attr("src", newSrc).fadeIn(400);
      });

      $("#illustration-title").fadeOut(400, function () {
        $(this).text(newTitle).fadeIn(400);
      });

      $("#illustration-info").fadeOut(400, function () {
        $(this).html(newInfo).fadeIn(400);
      });

      $("#illustration-statement").fadeOut(400, function () {
        $(this).html(newStatement).fadeIn(400);
      });
      
    });
  });

  window.addEventListener('DOMContentLoaded', () => {
    const fadeElems = document.querySelectorAll('.fade-in');
    fadeElems.forEach((el, i) => {
      setTimeout(() => {
        el.classList.add('visible');
      }, i * 300); 
    });
  });

    </script>
